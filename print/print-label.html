<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Label Customer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================
           KERTAS PRINTER : A4 (210mm x 297mm)
           AREA LABEL     : 210mm x 165mm (21cm x 16,5cm)
           ============================================
           Label  : 100mm x 50mm (10cm x 5cm)
           Grid   : 2 kolom x 3 baris = 6 label
           Gap    : 4mm horizontal, 3mm vertikal
           
           Padding area label:
           - Kiri  : 3mm (0,3cm)
           - Kanan : 3mm (0,3cm)
           - Atas  : 6mm (0,6cm)
           - Bawah : 3mm (sisa)
           
           Verifikasi horizontal:
           3 + 100 + 4 + 100 + 3 = 210mm ✅
           
           Verifikasi vertikal:
           6 + 50 + 3 + 50 + 3 + 50 + 3 = 165mm ✅
           ============================================ */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0;
            padding: 0;
            background: white;
            font-family: 'Courier New', 'Lucida Console', monospace;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .label-area {
            width: 210mm;
            height: 165mm;
            padding: 6mm 3mm 3mm 3mm;
            margin: 0;
            display: block;
        }

        .labels-grid {
            display: grid;
            grid-template-columns: 100mm 100mm;
            grid-template-rows: 50mm 50mm 50mm;
            gap: 3mm 4mm;
            width: 204mm;
            height: 156mm;
            margin: 0;
            padding: 0;
        }

        .label-card {
            background: white;
            border: 0.5px solid #ccc;
            padding: 2mm 1mm;
            overflow: hidden;
            width: 100mm;
            height: 50mm;
            display: block;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .label-body {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .customer-name {
            font-size: 12pt;
            font-weight: bold;
            text-align: left;
            word-break: break-word;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1mm;
        }

        .customer-address {
            font-size: 10pt;
            line-height: 1.25;
            word-break: break-word;
            overflow: hidden;
            margin-bottom: 1mm;
        }

        .customer-pic {
            font-size: 10pt;
            font-weight: bold;
            line-height: 1.25;
            word-break: break-word;
            overflow: hidden;
            margin-top: 0;
        }

        .label-card.empty {
            /* kosong */
        }

        /* ============================================
           SAAT PRINT
           ============================================ */
        @media print {
            html, body {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;
            }

            .label-area {
                width: 210mm;
                height: 165mm;
                padding: 6mm 3mm 3mm 3mm;
                margin: 0;
            }

            .label-card {
                border: none !important;
                padding: 2mm 1mm;
            }
        }
    </style>
</head>
<body>
    <div class="label-area">
        <div class="labels-grid" id="labelsGrid">
            <!-- diisi JS -->
        </div>
    </div>

    <script>
        function getLabelData() {
            const saved = localStorage.getItem('cetakLabelData');
            if (saved) {
                try { return JSON.parse(saved); } catch(e) { return {}; }
            }
            return {};
        }

        function escapeHtml(str) {
            if (!str || str === '-' || str === '') return '-';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function hasCustomerData(customer) {
            return customer && customer.nama && customer.nama !== '-' && customer.nama.trim() !== '';
        }

        function createDataLabel(customer) {
            const pic = customer.pic && customer.pic !== '-' ? customer.pic : '';
            const hp  = customer.hp  && customer.hp  !== '-' ? customer.hp  : '';

            let picHp = '';
            if (pic && hp)      picHp = `${pic} - ${hp}`;
            else if (pic)       picHp = pic;
            else if (hp)        picHp = hp;
            else                picHp = '-';

            return `
                <div class="label-card">
                    <div class="label-body">
                        <div class="customer-name">${escapeHtml(customer.nama)}</div>
                        <div class="customer-address">${escapeHtml(customer.alamat || '-')}</div>
                        <div class="customer-pic">${escapeHtml(picHp)}</div>
                    </div>
                </div>
            `;
        }

        function createEmptyLabel() {
            return `<div class="label-card empty"></div>`;
        }

        function renderLabels() {
            const labelData = getLabelData();
            const grid = document.getElementById('labelsGrid');

            const labelKeys = ['B3', 'I3', 'B7', 'I7', 'B11', 'I11'];

            let html = '';
            for (const key of labelKeys) {
                const customer = labelData[key];
                if (hasCustomerData(customer)) {
                    html += createDataLabel(customer);
                } else {
                    html += createEmptyLabel();
                }
            }

            grid.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLabels();
            setTimeout(() => { window.print(); }, 300);
        });
    </script>
</body>
</html>
