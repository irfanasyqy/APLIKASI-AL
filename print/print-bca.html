<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Print Bank Panin</title>
    <style>
        /* ======================================== */
        /* RESET & DASAR */
        /* ======================================== */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        /* ======================================== */
        /* UKURAN KERTAS TETAP A4 - TANPA SCALING */
        /* ======================================== */
        @page {
            size: A4 portrait;
            margin: 0;
            width: 210mm;
            height: 297mm;
        }

        body { 
            font-family: 'Courier New', monospace;
            font-size: 10pt; 
            width: 210mm; 
            min-height: 297mm; 
            margin: 0;
            padding: 0;
            background: white;
            overflow: hidden;
        }

        .print-container { 
            background: white; 
            width: 210mm;
            min-height: 297mm; 
            position: relative; 
            padding: 5mm;
            margin: 0;
            overflow: hidden;
            transform: none;
        }

        /* ======================================== */
        /* KOLOM KIRI - DATA PENGIRIM & PENERIMA */
        /* ======================================== */

        .currency { 
            position: absolute; 
            top: 20mm; 
            left: 18mm; 
            font-size: 11pt; 
            font-weight: bold; 
            white-space: nowrap; 
        }

        .jumlah-angka { 
            position: absolute; 
            top: 20mm; 
            left: 50mm; 
            font-size: 11pt; 
            font-weight: bold; 
            white-space: nowrap; 
        }

        .terbilang { 
            position: absolute; 
            top: 168mm; 
            left: 20mm; 
            font-size: 8pt;
            font-weight: bold; 
            max-width: 90mm; 
            white-space: normal; 
            word-wrap: break-word; 
            line-height: 1.2; 
            display: -webkit-box; 
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        .nama-penerima { 
            position: absolute; 
            top: 40mm; 
            left: 40mm; 
            font-size: 8pt;
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 110mm; 
            overflow-x: auto; 
        }

        .account { 
            position: absolute; 
            top: 35mm; 
            left: 40mm;
            font-size: 8pt;
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .alamat { 
            position: absolute; 
            top: 45mm; 
            left: 40mm; 
            font-weight: bold;
            font-size: 8pt; 
            max-width: 70mm; 
            white-space: normal; 
            word-wrap: break-word; 
            line-height: 1.2; 
            display: -webkit-box; 
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        /* ======================================== */
        /* FIELD BARU: PIC, ALAMAT PT, EMAIL, KOTA */
        /* ======================================== */
        .pic-nama {
            position: absolute;
            top: 92mm;        /* ← ATUR POSISI DI SINI */
            left: 40mm;
            font-weight: bold;
            font-size: 8pt;
            white-space: nowrap;
            max-width: 110mm;
            overflow-x: auto;
        }

        .pic-alamat-pt {
            position: absolute;
            top: 87mm;        /* ← ATUR POSISI DI SINI */
            left: 40mm;
            font-weight: bold;
            font-size: 8pt;
            max-width: 90mm;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pic-email {
            position: absolute;
            top: 100mm;        /* ← ATUR POSISI DI SINI */
            left: 40mm;
            font-weight: bold;
            font-size: 8pt;
            white-space: nowrap;
            max-width: 90mm;
            overflow-x: auto;
        }

        .pic-kota {
            position: absolute;
            top: 105mm;        /* ← ATUR POSISI DI SINI */
            left: 40mm;
            font-weight: bold;
            font-size: 8pt;
            white-space: nowrap;
            max-width: 90mm;
            overflow-x: auto;
        }

        /* ======================================== */
        /* ELEMEN LAINNYA - SESUAIKAN POSISINYA */
        /* ======================================== */
        .bank-name { 
            position: absolute; 
            top: 76mm; 
            left: 30mm; 
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .bank-alamat { 
            position: absolute; 
            top: 78mm; 
            left: 20mm; 
            max-width: 90mm;
            font-weight: bold; 
            white-space: normal; 
            word-wrap: break-word; 
            line-height: 1.2; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        .negara2 { 
            position: absolute; 
            top: 69mm; 
            left: 45mm; 
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .pengirim { 
            position: absolute; 
            top: 85mm; 
            left: 45mm; 
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .deretan-angka { 
            position: absolute; 
            top: 120mm; 
            left: 45mm; 
            font-weight: bold; 
            letter-spacing: 0px; 
            white-space: nowrap; 
            overflow-x: auto; 
            max-width: 90mm; 
        }

        /* ======================================== */
        /* KOLOM KANAN - REFERENSI & TOTAL */
        /* ======================================== */

        .bank-name { 
            position: absolute; 
            top: 35mm; 
            left: 135mm; 
            font-size: 11pt;
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }
        
        .bank-alamat { 
            position: absolute; 
            top: 40mm; 
            left: 135mm; 
            max-width: 90mm;
            font-weight: bold; 
            white-space: normal; 
            word-wrap: break-word; 
            line-height: 1.2; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        .swift { 
            position: absolute; 
            top: 50mm; 
            left: 135mm; 
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .negara { 
            position: absolute; 
            top: 59mm; 
            left: 135mm; 
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .berita { 
            position: absolute; 
            top: 86mm; 
            left: 135mm;
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        .tujuan { 
            position: absolute; 
            top: 90mm; 
            left: 135mm; 
            font-weight: bold; 
            white-space: nowrap; 
            max-width: 90mm; 
            overflow-x: auto; 
        }

        /* ======================================== */
        /* RINCIAN BIAYA - BONGKARAN */
        /* ======================================== */

        .rincian-bongkaran {
            position: absolute;
            top: 150mm;
            left: 45mm;
            width: auto;
            font-size: 8pt;
            font-weight: bold;
        }

        .baris-total {
            display: none !important;
        }

        .rincian-wrapper {
            position: relative;
            width: 100%;
            height: 30mm;
        }

        .baris-rincian, .baris-total {
            position: absolute;
            left: 0;
            display: flex;
            flex-direction: row;
            gap: 5mm;
            white-space: nowrap;
        }

        .baris-1 { top: 0mm; left: 0mm; }
        .baris-2 { top: 6mm; left: 0mm; }
        .baris-3 { top: 12mm; left: 5mm; }
        .baris-total { top: 18mm; left: 0mm; font-weight: bold; }

        .valuta-col { width: 10mm; text-align: left; }
        .kurs-col   { width: 25mm; text-align: right; }
        .nilai-col  { width: 12mm; text-align: right; }

        /* ======================================== */
        /* WEB PREVIEW */
        /* ======================================== */
        @media screen {
            body { 
                width: 210mm;
                min-height: 297mm;
                margin: 20px auto;
                padding: 0;
                background: #e0e0e0;
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
                transform: none;
                transform-origin: top left;
            }
            
            .print-container { 
                margin: 0 auto;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
        }

        /* ======================================== */
        /* MEDIA PRINT */
        /* ======================================== */
        @media print { 
            body { 
                background: white; 
                margin: 0; 
                padding: 0; 
                box-shadow: none; 
                width: 210mm;
                min-height: 297mm;
            } 
            .print-container { 
                box-shadow: none; 
                padding: 5mm;
                margin: 0;
                width: 210mm;
                min-height: 297mm;
            } 
            @page { 
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div id="printContainer"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        
        // ========== DATA TRANSAKSI ==========
        const data = {
            currency: params.get('currency') || 'USD',
            jumlah: parseFloat(params.get('jumlah')) || 0,
            terbilang: params.get('terbilang') || '-',
            nama: params.get('nama') || '-',
            account: params.get('account') || '-',
            alamat: params.get('alamat') || '-',
            bankName: params.get('bankName') || '-',
            bankAlamat: params.get('bankAlamat') || '-',
            swift: params.get('swift') || '',
            country: params.get('country') || '-',
            berita: params.get('berita') || '-',
            tujuan: params.get('tujuan') || '-',
            noLoa: params.get('noLoa') || '-',
            norekPengirim: params.get('norekPengirim') || '',
            pengirim: params.get('pengirim') || '-',
            biayaTelex: parseFloat(params.get('biayaTelex')) || 0,
            metodeTransfer: params.get('metodeTransfer') || 'SHARE',
            biayaFullAmount: parseFloat(params.get('biayaFullAmount')) || 0,
            jenis: params.get('jenis') || 'transfer',
            kurs: parseFloat(params.get('kurs')) || 0,
            jumlahIDR: parseFloat(params.get('jumlahIDR')) || 0
        };

        // ========== AMBIL DATA PROFIL PERUSAHAAN ==========
        let companyProfile = null;
        try {
            const storedData = localStorage.getItem('companyProfile');
            if (storedData) {
                companyProfile = JSON.parse(storedData);
                console.log('✅ Profil perusahaan dimuat dari localStorage');
            }
        } catch (e) {
            console.warn('⚠️ Gagal membaca profil dari localStorage:', e);
        }

        // ========== DATA PROFIL (PIC, ALAMAT PT, EMAIL, KOTA) ==========
        const picNama = params.get('picNama') || 
                       (companyProfile ? companyProfile.picNama : 'Linawaty Poppy');

        const picAlamatPT = params.get('picAlamatPT') || 
                           (companyProfile ? companyProfile.picAlamatPT : 'Jl. Gunung Sahari 2 No. 7');

        const picEmail = params.get('picEmail') || 
                        (companyProfile ? companyProfile.picEmail : 'Lpoppy@sccbakery.com');

        const picKota = params.get('picKota') || 
                       (companyProfile ? companyProfile.picKota : 'Jakarta Pusat');

        // ========== FORMAT ANGKA ==========
        const formatAngka = (angka, curr) => {
            if (isNaN(angka) || angka === 0) return '0';
            const hasDecimal = angka % 1 !== 0;
            if (hasDecimal) {
                return angka.toLocaleString('id-ID', { 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                });
            } else {
                return angka.toLocaleString('id-ID', { 
                    minimumFractionDigits: 0, 
                    maximumFractionDigits: 0 
                });
            }
        };

        const formatKurs = (angka) => {
            if (isNaN(angka) || angka === 0) return '0';
            const hasDecimal = angka % 1 !== 0;
            if (hasDecimal) {
                return angka.toLocaleString('id-ID', { 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                });
            } else {
                return angka.toLocaleString('id-ID', { 
                    minimumFractionDigits: 0, 
                    maximumFractionDigits: 0 
                });
            }
        };

        const formatAngkaPintar = (angka, currency) => {
            if (isNaN(angka) || angka === 0) return '0';
            const hasDecimal = angka % 1 !== 0;
            if (hasDecimal) {
                return angka.toLocaleString('id-ID', { 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                });
            } else {
                return angka.toLocaleString('id-ID', { 
                    minimumFractionDigits: 0, 
                    maximumFractionDigits: 0 
                });
            }
        };

        const formattedJumlah = formatAngka(data.jumlah, data.currency);
        const formattedBiayaFull = formatAngka(data.biayaFullAmount, data.currency);
        const formattedBiayaTelex = data.biayaTelex.toLocaleString('id-ID', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        const formattedKurs = formatKurs(data.kurs);
        
        let formattedBiayaFullIDR = '0';
        let biayaFullIDRValue = 0;
        if (data.kurs > 0 && data.biayaFullAmount > 0) {
            biayaFullIDRValue = data.biayaFullAmount * data.kurs;
            formattedBiayaFullIDR = formatAngka(biayaFullIDRValue, 'IDR');
        }
        
        let showBiayaFull = false;
        if (data.metodeTransfer === 'FULL_AMOUNT') {
            showBiayaFull = true;
        }
        
        const norekFormat = data.norekPengirim.split('').join(' ');
        
        // ========== 3 KONDISI ==========
        const isPembelianValas = (data.jenis === 'valas');
        const isTransferValas = (!isPembelianValas && data.kurs > 0 && data.currency !== 'IDR');
        const isTransferBiasa = (!isPembelianValas && !isTransferValas);
        
        let totalDisplay = '';
        let rincianHtml = '';
        
        if (isPembelianValas) {
            let nilaiEkuivalen = data.jumlahIDR;
            let totalNilai = nilaiEkuivalen;
            
            rincianHtml = `
                <div class="rincian-bongkaran">
                    <div class="rincian-wrapper">
                        <div class="baris-rincian baris-1">
                            <span class="valuta-col">${data.currency} ${formattedJumlah}</span>
                            <span class="kurs-col">${formattedKurs}</span>
                            <span class="nilai-col">IDR ${formatAngka(nilaiEkuivalen, 'IDR')}</span>
                        </div>
                        <div class="baris-total" style="top: 8mm;">
                            <span class="valuta-col">Total</span>
                            <span class="kurs-col"></span>
                            <span class="nilai-col">IDR ${formatAngka(totalNilai, 'IDR')}</span>
                        </div>
                    </div>
                </div>
            `;
            totalDisplay = `IDR ${formatAngka(totalNilai, 'IDR')}`;
        }
        else if (isTransferValas) {
            let totalNilaiEkuivalen = 0;
            let rowsHtml = '';
            
            let baris1Nilai = data.jumlah * data.kurs;
            let formattedBaris1Nilai = formatAngka(baris1Nilai, 'IDR');
            rowsHtml += `
                <div class="baris-rincian baris-1">
                    <span class="valuta-col">${data.currency} ${formattedJumlah}</span>
                    <span class="kurs-col">${formattedKurs}</span>
                    <span class="nilai-col">IDR ${formattedBaris1Nilai}</span>
                </div>
            `;
            totalNilaiEkuivalen += baris1Nilai;
            
            if (showBiayaFull) {
                rowsHtml += `
                    <div class="baris-rincian baris-2">
                        <span class="valuta-col">${data.currency} ${formattedBiayaFull}</span>
                        <span class="kurs-col">${formattedKurs}</span>
                        <span class="nilai-col">IDR ${formattedBiayaFullIDR}</span>
                    </div>
                `;
                totalNilaiEkuivalen += biayaFullIDRValue;
            }
            
            if (data.biayaTelex > 0) {
                rowsHtml += `
                    <div class="baris-rincian baris-3">
                        <span class="valuta-col"></span>
                        <span class="kurs-col"></span>
                        <span class="nilai-col">IDR ${formattedBiayaTelex}</span>
                    </div>
                `;
                totalNilaiEkuivalen += data.biayaTelex;
            }
            
            let totalValue = `IDR ${formatAngka(totalNilaiEkuivalen, 'IDR')}`;
            rowsHtml += `
                <div class="baris-total">
                    <span class="valuta-col">Total</span>
                    <span class="kurs-col"></span>
                    <span class="nilai-col">${totalValue}</span>
                </div>
            `;
            
            rincianHtml = `<div class="rincian-bongkaran"><div class="rincian-wrapper">${rowsHtml}</div></div>`;
            totalDisplay = totalValue;
        }
        else {
            let totalNilaiEkuivalenUSD = 0;
            let rowsHtml = '';
            const hideValas = true;
            
            rowsHtml += `
                <div class="baris-rincian baris-1">
                    <span class="valuta-col">${hideValas ? '' : data.currency + ' ' + formattedJumlah}</span>
                    <span class="kurs-col"></span>
                    <span class="nilai-col">${data.currency} ${formattedJumlah}</span>
                </div>
            `;
            totalNilaiEkuivalenUSD += data.jumlah;
            
            if (showBiayaFull) {
                rowsHtml += `
                    <div class="baris-rincian baris-2">
                        <span class="valuta-col">${hideValas ? '' : data.currency + ' ' + formattedBiayaFull}</span>
                        <span class="kurs-col"></span>
                        <span class="nilai-col">${data.currency} ${formattedBiayaFull}</span>
                    </div>
                `;
                totalNilaiEkuivalenUSD += data.biayaFullAmount;
            }
            
            if (data.biayaTelex > 0) {
                rowsHtml += `
                    <div class="baris-rincian baris-3">
                        <span class="valuta-col"></span>
                        <span class="kurs-col"></span>
                        <span class="nilai-col">IDR ${formattedBiayaTelex}</span>
                    </div>
                `;
            }
            
            let totalValue = `${data.currency} ${formatAngka(totalNilaiEkuivalenUSD, data.currency)}`;
            rowsHtml += `
                <div class="baris-total">
                    <span class="valuta-col">${hideValas ? '' : 'Total'}</span>
                    <span class="kurs-col"></span>
                    <span class="nilai-col">${totalValue}</span>
                </div>
            `;
            
            rincianHtml = `<div class="rincian-bongkaran"><div class="rincian-wrapper">${rowsHtml}</div></div>`;
            totalDisplay = totalValue;
        }

        // ========== RENDER HTML ==========
        const html = `
            <div class="print-container">
                <!-- KIRI -->
                <div class="terbilang">${data.terbilang}</div>
                
                <div class="nama-penerima">${data.nama}</div>
                <div class="account">${data.account}</div>
                <div class="alamat">${data.alamat}</div>
                
                <!-- FIELD BARU: PIC, ALAMAT PT, EMAIL, KOTA -->
                <div class="pic-nama">${picNama}</div>
                <div class="pic-alamat-pt">${picAlamatPT}</div>
                <div class="pic-email">${picEmail}</div>
                <div class="pic-kota">${picKota}</div>
                
                <div class="negara2">${data.country}</div>
                
                <div class="bank-name">${data.bankName}</div>
                <div class="bank-alamat">${data.bankAlamat}</div>
                <div class="swift">${data.swift}</div>

                <div class="negara">${data.country}</div>
                
                <div class="berita">${data.berita}</div>
                <div class="tujuan">${data.tujuan}</div>
                
                <div class="pengirim">${data.pengirim}</div>
                <div class="deretan-angka">${norekFormat}</div>
                
                ${rincianHtml}
            </div>
        `;
        
        document.getElementById('printContainer').innerHTML = html;

        // ========== AUTO PRINT ==========
        const autoPrintParam = params.get('autoPrint') || 'false';
        const isAutoPrint = autoPrintParam === 'true';

        if (isAutoPrint) {
            console.log('🖨️ Auto Print ENABLED');
            if (document.readyState === 'complete') {
                window.print();
                setTimeout(function() {
                    window.close();
                }, 2000);
            } else {
                window.addEventListener('load', function() {
                    window.print();
                    setTimeout(function() {
                        window.close();
                    }, 2000);
                });
            }
        }
    </script>
</body>
</html>
